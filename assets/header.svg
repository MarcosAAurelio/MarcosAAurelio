      <stop stop-color="#071A2A"/>
      <stop offset="0.52" stop-color="#0D2C3D"/>
      <stop offset="1" stop-color="#092131"/>
    </linearGradient>
    <linearGradient id="contact" x1="270" y1="170" x2="1130" y2="236" gradientUnits="userSpaceOnUse">
